name: FeedLens CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    name: ${{ matrix.target }} library checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          # The local 0.1.20260920 toolchain has no downloadable Linux asset
          # (the official versioned URL returns 403); latest is verified
          # downloadable for GitHub-hosted Linux runners.
          version: latest
      - name: Refresh MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}

  native-cli:
    name: native CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
        with:
          version: latest
      - name: Refresh MoonBit registry
        run: moon update
      - name: Render RSS and Atom summaries
        run: |
          moon run --target native cmd/main samples/rss2_compat.xml
          moon run --target native cmd/main samples/atom1_compat.xml
      - name: Emit JSON Feed normalized JSON
        run: |
          moon run --target native cmd/main --json samples/jsonfeed11_compat.json > feedlens.json
          python3 -c "import json; result=json.load(open('feedlens.json', encoding='utf-8')); assert result['format'] == 'jsonfeed1'; assert len(result['entries']) == 2"
      - name: Inspect attachment samples
        run: |
          moon run --target native cmd/main samples/rss2_attachments.xml > rss-attachments.txt
          grep -q 'attachments: 2' rss-attachments.txt
          moon run --target native cmd/main --json samples/atom1_attachments.xml > atom-attachments.json
          moon run --target native cmd/main --json samples/jsonfeed11_attachments.json > json-attachments.json
          python3 -c "import json; atom=json.load(open('atom-attachments.json', encoding='utf-8')); jf=json.load(open('json-attachments.json', encoding='utf-8')); assert atom['entries'][0]['link'] == 'https://example.test/articles/one'; assert len(atom['entries'][0]['attachments']) == 2; assert jf['entries'][0]['attachments'][0]['duration_in_seconds'] == 12.5"
      - name: Inspect real-feed offline projections
        run: |
          moon run --target native cmd/main samples/real_wptavern_rss.xml > real-rss.txt
          grep -q 'size (bytes): 37878054' real-rss.txt
          moon run --target native cmd/main --json samples/real_wptavern_atom.xml > real-atom.json
          moon run --target native cmd/main --json samples/real_wptavern_json.json > real-json.json
          python3 -c "import json; atom=json.load(open('real-atom.json', encoding='utf-8')); jf=json.load(open('real-json.json', encoding='utf-8')); assert len(atom['entries']) == len(jf['entries']) == 2; assert atom['entries'][0]['attachments'][0]['size_in_bytes'] == jf['entries'][0]['attachments'][0]['size_in_bytes'] == 37878054"
      - name: Show CLI help
        run: moon run --target native cmd/main -- --help
