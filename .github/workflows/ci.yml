name: FeedLens CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-archived-feeds:
    name: Pinned complete-response end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: conorbronsdon/mojo-feed
          ref: be9e1dbc17faea2723fa3224512f184738adb43d
          path: full-feed-source
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: rowanmanning/sample-feeds
          ref: a2dd1a6d1430294e154c2729f0c0615e431dbbe5
          path: valid-atom-source
          persist-credentials: false
      - name: Install MoonBit from official script
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
      - run: moon update
      - name: Parse and compare complete pinned publisher responses
        run: uv run --with feedparser==6.0.11 python tools/check_full_archived_feeds.py full-feed-source/test/data
      - name: Parse complete author-valid Atom archive
        run: uv run --with feedparser==6.0.11 python tools/check_full_valid_atom.py valid-atom-source/content/real-world/d1b6d321bb845c85d51711e414bf56c9/feed.xml

  independent-reference:
    name: Offline cross-format reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit from official script
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@v6
      - run: moon update
      - name: Compare saved real projections and independent Atom Entry
        run: uv run --with feedparser==6.0.11 python tools/check_real_cross_format.py
      - name: Compare three additional publisher snapshots
        run: uv run --with feedparser==6.0.11 python tools/check_diverse_real_reference.py
      - name: Compare legal Atom and JSON Feed text boundaries
        run: uv run --with feedparser==6.0.11 python tools/check_legal_input_reference.py
      - name: Compare JSON Feed attachment recovery
        run: python3 tools/check_json_attachment_recovery.py
      - name: Compare RSS and JSON Feed attachment media types
        run: python3 tools/check_attachment_media_types.py
      - name: Compare JSON Feed numeric attachment byte counts
        run: python3 tools/check_json_attachment_numbers.py
      - name: Compare Atom XHTML wrapper attributes
        run: uv run --with feedparser==6.0.11 python tools/check_xhtml_container_reference.py
      - name: Compare cross-format unknown local offsets
        run: uv run --with feedparser==6.0.11 python tools/check_unknown_offset_reference.py
      - name: Compare announced leap-second dates and saved feed values
        run: uv run --with feedparser==6.0.11 python tools/check_leap_second_reference.py
      - name: Compare Atom MIME parameter content forms
        run: uv run --with feedparser==6.0.11 python tools/check_atom_media_reference.py
      - name: Compare Atom link MIME hints and diagnostics
        run: python3 tools/check_atom_link_media_reference.py
      - name: Compare alternate MIME identity and declared spelling
        run: python3 tools/check_atom_link_type_case.py
      - name: Compare Atom link language tags and translated alternates
        run: python3 tools/check_atom_link_language_reference.py
      - name: Compare Atom link relation declarations and diagnostics
        run: python3 tools/check_atom_link_relations.py
      - name: Compare Atom link href references and raw recovery
        run: python3 tools/check_atom_link_hrefs.py
      - name: Compare Atom external content src references and recovery
        run: python3 tools/check_atom_content_src_syntax.py
      - name: Compare Atom person URI declarations and diagnostics
        run: python3 tools/check_atom_person_iri_syntax.py
      - name: Compare Atom Person email declarations and recovery
        run: python3 tools/check_atom_email_reference.py
      - name: Compare Atom Person nested markup and extension boundaries
        run: python3 tools/check_atom_person_nested.py
      - name: Compare present empty Atom generator text across scopes
        run: python3 tools/check_atom_generator_text.py
      - name: Compare Atom generator and visual IRI references
        run: python3 tools/check_atom_visual_iri.py
      - name: Compare Atom and JSON date and author boundaries
        run: uv run --with feedparser==6.0.11 python tools/check_date_author_reference.py
      - name: Compare Atom source IRI scopes
        run: uv run --with feedparser==6.0.11 python tools/check_source_authority_reference.py
      - name: Compare empty Atom IRI references and scoped bases
        run: uv run --with feedparser==6.0.11 python tools/check_atom_empty_iri_reference.py
      - name: Compare declared Atom metadata strings
        run: uv run --with feedparser==6.0.11 python tools/check_atom_declared_metadata_reference.py
      - name: Compare absolute Atom category schemes
        run: python3 tools/check_atom_category_schemes.py
      - name: Compare Atom absolute ids and raw invalid declarations
        run: python3 tools/check_atom_id_reference.py
      - name: Compare Atom date construct diagnostics with Python calendar parsing
        run: python3 tools/check_atom_date_validation.py
      - name: Compare Atom feed element order with independent XML tree walk
        run: python3 tools/check_atom_feed_order.py
      - name: Compare scoped Atom cardinality and recovered fields
        run: python3 tools/check_atom_cardinality.py
      - name: Compare JSON Feed date recovery with Python calendar parsing
        run: python3 tools/check_json_date_validation.py
      - name: Compare JSON Feed item identity and duplicate diagnostics
        run: python3 tools/check_json_identity_reference.py
      - name: Compare JSON Feed versioned author precedence and inheritance
        run: python3 tools/check_json_author_versions.py
      - name: Compare JSON Feed pagination URL equivalence with Python
        run: python3 tools/check_json_pagination_reference.py
      - name: Compare RSS date diagnostics with Python mail-date parsing
        run: python3 tools/check_rss_date_validation.py
      - name: Compare RSS permalink guid roles with independent XML parsing
        run: python3 tools/check_rss_permalink_reference.py
      - name: Compare RSS core singleton scopes with XML and CLI
        run: python3 tools/check_rss_cardinality.py
      - name: Compare RSS Atom self-link extension with independent XML parsing
        run: python3 tools/check_rss_atom_self_reference.py
      - name: Compare BOM-prefixed RSS and JSON Feed files with Python readers
        run: python3 tools/check_bom_input_reference.py
      - name: Compare RSS mixed-case dates and Z timezone with Python email
        run: python3 tools/check_rss_case_zone_reference.py

  library:
    name: ${{ matrix.target }} library checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, js, native]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit from official script
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Refresh MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }}
      - name: Verify public interface snapshot
        if: matrix.target == 'native'
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti
      - name: Test
        run: moon test --target ${{ matrix.target }}

  native-cli:
    name: native CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit from official script
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Refresh MoonBit registry
        run: moon update
      - name: Render RSS and Atom summaries
        run: |
          moon run --target native cmd/main samples/rss2_compat.xml
          moon run --target native cmd/main samples/atom1_compat.xml
      - name: Check native CLI error diagnostics
        run: python3 tools/check_cli_errors.py
      - name: Emit JSON Feed normalized JSON
        run: |
          moon run --target native cmd/main --json samples/jsonfeed11_compat.json > feedlens.json
          python3 -c "import json; result=json.load(open('feedlens.json', encoding='utf-8')); assert result['format'] == 'jsonfeed1'; assert len(result['entries']) == 2"
      - name: Inspect attachment samples
        run: |
          moon run --target native cmd/main samples/rss2_attachments.xml > rss-attachments.txt
          grep -q 'attachments: 2' rss-attachments.txt
          moon run --target native cmd/main --json samples/atom1_attachments.xml > atom-attachments.json
          moon run --target native cmd/main --json samples/jsonfeed11_attachments.json > json-attachments.json
          python3 -c "import json; atom=json.load(open('atom-attachments.json', encoding='utf-8')); jf=json.load(open('json-attachments.json', encoding='utf-8')); assert atom['entries'][0]['link'] == 'https://example.test/articles/one'; assert len(atom['entries'][0]['attachments']) == 2; assert jf['entries'][0]['attachments'][0]['duration_in_seconds'] == 12.5"
      - name: Inspect real-feed offline projections
        run: |
          moon run --target native cmd/main samples/real_wptavern_rss.xml > real-rss.txt
          grep -q 'rss_image:' real-rss.txt
          grep -q 'size (bytes): 37878054' real-rss.txt
          moon run --target native cmd/main --json samples/real_wptavern_atom.xml > real-atom.json
          moon run --target native cmd/main --json samples/real_wptavern_json.json > real-json.json
          python3 -c "import json; atom=json.load(open('real-atom.json', encoding='utf-8')); jf=json.load(open('real-json.json', encoding='utf-8')); assert len(atom['entries']) == len(jf['entries']) == 2; assert atom['images'][0]['role'] == 'atom_icon'; assert jf['images'][0]['role'] == 'json_icon'; assert jf['entries'][0]['images'][0]['role'] == 'json_featured'; assert atom['entries'][0]['attachments'][0]['size_in_bytes'] == jf['entries'][0]['attachments'][0]['size_in_bytes'] == 37878054"
      - name: Inspect distinct JSON item display fields
        run: |
          moon run --target native cmd/main --json samples/jsonfeed11_display.json > display.json
          python3 -c "import json; x=json.load(open('display.json', encoding='utf-8')); e=x['entries'][0]; assert x['language'] == 'en-US'; assert x['images'][1]['role'] == 'json_favicon'; assert e['link'] == 'posts/one'; assert e['external_url'] == 'https://outside.test/story'; assert [i['role'] for i in e['images']] == ['json_featured','json_banner']; assert e['attachments'] == []"
      - name: Inspect Atom XHTML normalized JSON
        run: |
          moon run --target native cmd/main --json samples/atom1_xhtml.xml > atom-xhtml.json
          python3 -c "import json; x=json.load(open('atom-xhtml.json', encoding='utf-8')); e=x['entries'][0]; assert x['title'] == 'Plan A & B' and x['title_kind'] == 'xhtml' and '<h:em' in x['title_xhtml']['markup']; assert e['title'] == 'Race review' and e['content_kind'] == 'xhtml' and '<h:strong' in e['content_xhtml']['markup']"
      - name: Inspect Atom XHTML wrapper attributes
        run: |
          moon run --target native cmd/main --json samples/atom1_xhtml_container.xml > atom-xhtml-container.json
          python3 -c "import json; x=json.load(open('atom-xhtml-container.json', encoding='utf-8')); e=x['entries'][0]; assert x['diagnostics']==[]; assert x['title_xhtml']['container_attributes']==[{'local_name':'class','namespace_uri':None,'value':'headline'},{'local_name':'title','namespace_uri':None,'value':'A & B'}]; assert e['content_xhtml']['container_attributes'][2]=={'local_name':'base','namespace_uri':'http://www.w3.org/XML/1998/namespace','value':'assets/'}"
      - name: Inspect Atom external and text MIME content
        run: |
          moon run --target native cmd/main --json samples/atom1_content_sources.xml > atom-content-sources.json
          python3 -c "import json; x=json.load(open('atom-content-sources.json', encoding='utf-8')); a,b=x['entries']; assert a['content'] is None and a['content_source'] == 'issue.pdf' and a['content_media_type'] == 'application/pdf'; assert b['content'] == 'Heading & details' and b['content_media_type'] == 'text/markdown'; assert x['diagnostics'] == []"
      - name: Inspect Atom content variants
        run: |
          moon run --target native cmd/main --json samples/atom1_content_forms.xml > atom-content.json
          python3 -c "import json; x=json.load(open('atom-content.json', encoding='utf-8')); e=x['entries']; assert [v['atom_body']['kind'] for v in e] == ['external','inline_text','inline_xml','inline_binary']; assert e[0]['atom_body']['src'] == 'entry.xml'; assert e[1]['atom_body']['media_type'] == 'TEXT/MARKDOWN'; assert '<n0:root' in e[2]['atom_body']['markup']; assert e[3]['atom_body']['base64'] == 'AQID/w==' and e[3]['atom_body']['byte_length'] == 4"
      - name: Inspect Atom MIME parameter forms
        run: |
          moon run --target native cmd/main --json samples/atom1_mime_parameters.xml > atom-mime.json
          python3 -c "import json; x=json.load(open('atom-mime.json', encoding='utf-8')); e=x['entries']; assert [v['atom_body']['kind'] for v in e] == ['inline_text','inline_xml','inline_binary','external']; assert e[0]['content']=='A & B' and 'a;b' in e[0]['content_media_type']; assert e[2]['atom_body']['base64']=='AQID/w==' and e[3]['atom_body']['src']=='media/pic.png'; assert x['diagnostics']==[]"
      - name: Inspect additional standard fields
        run: |
          moon run --target native cmd/main --json samples/rss2_standard_fields.xml > standard-rss.json
          moon run --target native cmd/main --json samples/atom1_standard_fields.xml > standard-atom.json
          moon run --target native cmd/main --json samples/jsonfeed11_standard_fields.json > standard-json.json
          python3 -c "import json; r=json.load(open('standard-rss.json')); a=json.load(open('standard-atom.json')); j=json.load(open('standard-json.json')); assert r['generator']=='Publisher 2' and r['entries'][0]['comments_url']=='comments/one'; assert a['rights_kind']=='xhtml' and a['rights_xhtml']['markup']; assert j['next_url']=='older.json' and j['expired'] is False and j['entries'][0]['content_text']=='One' and j['authors'][0]['avatar']=='avatars/editor.png'"
      - name: Inspect RSS polling hints
        run: |
          moon run --target native cmd/main --json samples/rss2_skip_schedule.xml > rss-skip.json
          python3 -c "import json; x=json.load(open('rss-skip.json', encoding='utf-8')); assert x['skip_hours']==[0,23] and x['skip_days']==['Sunday','Monday'] and x['diagnostics']==[]"
      - name: Independently compare RSS optional fields and JSON Feed 1.0 IDs
        run: python3 tools/check_optional_channel_and_legacy_ids.py
      - name: Inspect Atom aggregation source metadata
        run: |
          moon run --target native cmd/main --json samples/atom1_source_metadata.xml > atom-source.json
          python3 -c "import json; x=json.load(open('atom-source.json')); s=x['entries'][0]['atom_source']; assert x['diagnostics']==[]; assert x['generator_uri']=='tools/agg' and x['generator_version']=='3'; assert s['subtitle_kind']=='html' and s['generator_uri']=='tool'; assert [v['rel'] for v in s['links']]==['alternate','self']; assert [v['role'] for v in s['images']]==['atom_icon','atom_logo']"
      - name: Inspect legal empty text and inherited Atom rights
        run: |
          moon run --target native cmd/main --json samples/atom1_legal_empty_and_rights.xml > legal-atom.json
          moon run --target native cmd/main --json samples/jsonfeed11_opaque_strings.json > legal-json.json
          python3 -c "import json; a=json.load(open('legal-atom.json')); j=json.load(open('legal-json.json')); assert a['title']=='   ' and a['entries'][0]['title']=='' and a['entries'][0]['rights_xhtml']==a['rights_xhtml'] and a['entries'][1]['rights']=='' and a['diagnostics']==[]; assert [x['identifier'] for x in j['entries']]==['  stable  ','id:two'] and [x['term'] for x in j['entries'][0]['categories']]==['',' ','topic'] and [x['kind'] for x in j['diagnostics']]==[{'type':'InvalidJsonFeedItem','index':i,'field':'id'} for i in (2,3)]"
      - name: Inspect Atom and JSON date and author boundaries
        run: |
          moon run --target native cmd/main --json samples/atom1_date_case.xml > date-atom.json
          moon run --target native cmd/main --json samples/jsonfeed11_empty_author_date.json > author-json.json
          python3 -c "import json; a=json.load(open('date-atom.json')); j=json.load(open('author-json.json')); assert a['entries'][0]['published_at']=='2026-10-14T14:00:00+01:00' and a['diagnostics']==[]; assert [x['name'] for x in j['authors']]==['',None] and j['entries'][0]['authors'][0]['name']==' ' and j['entries'][2]['authors'][0]['name']=='' and j['diagnostics']==[]"
      - name: Inspect legal unknown-local-zone feed dates
        run: |
          moon run --target native cmd/main --json samples/rss2_unknown_offset.xml > unknown-rss.json
          moon run --target native cmd/main --json samples/atom1_unknown_offset.xml > unknown-atom.json
          moon run --target native cmd/main --json samples/jsonfeed11_unknown_offset.json > unknown-json.json
          python3 -c "import json; r=json.load(open('unknown-rss.json')); a=json.load(open('unknown-atom.json')); j=json.load(open('unknown-json.json')); assert r['diagnostics']==a['diagnostics']==j['diagnostics']==[]; assert r['entries'][0]['published_at'].endswith('-0000'); assert a['entries'][0]['updated_at'].endswith('-00:00'); assert j['entries'][0]['published_at'].endswith('-00:00')"
      - name: Inspect announced leap-second feed dates
        run: |
          moon run --target native cmd/main --json samples/rss2_leap_second.xml > leap-rss.json
          moon run --target native cmd/main --json samples/atom1_leap_second.xml > leap-atom.json
          moon run --target native cmd/main --json samples/jsonfeed11_leap_second.json > leap-json.json
          python3 -c "import json; r=json.load(open('leap-rss.json')); a=json.load(open('leap-atom.json')); j=json.load(open('leap-json.json')); assert r['diagnostics']==a['diagnostics']==j['diagnostics']==[]; assert r['entries'][0]['published_at'].endswith('23:59:60 GMT'); assert a['updated_at'].endswith('08:59:60+09:00'); assert j['entries'][0]['published_at'].endswith('18:59:60-05:00')"
      - name: Inspect raw Atom IRI fixture
        run: |
          moon run --target native cmd/main --json samples/atom1_iri_host.xml > atom-iri.json
          python3 -c "import json; x=json.load(open('atom-iri.json', encoding='utf-8')); e=x['entries'][0]; assert e['link']=='../文章/一?版=全#段' and e['attachments'][0]['url']=='音频/一.mp3' and x['diagnostics']==[]"
      - name: Inspect empty Atom IRI references
        run: |
          moon run --target native cmd/main --json samples/atom1_empty_iri_references.xml > atom-empty-iri.json
          python3 -c "import json; x=json.load(open('atom-empty-iri.json', encoding='utf-8')); e=x['entries'][0]; assert x['link']==e['link']==e['attachments'][0]['url']==e['content_source']==e['atom_body']['src']==e['atom_source']['link']=='' and x['diagnostics']==[]"
      - name: Inspect declared Atom metadata strings
        run: |
          moon run --target native cmd/main --json samples/atom1_declared_empty_metadata.xml > atom-declared-metadata.json
          python3 -c "import json; x=json.load(open('atom-declared-metadata.json', encoding='utf-8')); e=x['entries']; assert x['authors'][0]['name']=='' and x['categories'][0]['term']=='' and x['links'][0]['title']==''; assert e[0]['authors'][0]['name']=='  ' and e[0]['attachments'][0]['title']=='' and e[1]['authors'][0]['name']=='Origin' and e[2]['authors'][0]['name']==''; assert [(d['kind']['type'],d['line'],d['column']) for d in x['diagnostics']]==[('InvalidCategory',2,25),('InvalidCategory',3,118)]"
      - name: Run in-checkout public library consumer example
        run: |
          moon run --target native examples/consumer > consumer.txt
          grep -q 'published=2026-10-19T08:30:00Z' consumer.txt
          grep -q 'featured=https://example.test/images/preview.png' consumer.txt
          grep -q 'xhtml_title=Plan A' consumer.txt
          grep -q 'unknown_local_zone=2026-10-14T13:00:00Z:false' consumer.txt
          grep -q 'leap_second=2016-12-31T23:59:60Z:true' consumer.txt
          grep -q 'atom_binary_bytes=3' consumer.txt
          grep -q 'atom_entry_link=https://example.test/news/posts/one' consumer.txt
          grep -q 'rss_docs=https://example.test/rss-spec.html' consumer.txt
          grep -q 'rss_cloud=notify.example.test:80' consumer.txt
          grep -q 'rss_search=https://example.test/search' consumer.txt
      - name: Check a repository-external consumer against the current public API
        run: python3 tools/check_external_consumer.py
      - name: Show CLI help
        run: moon run --target native cmd/main -- --help
