name: FeedLens CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-reference:
    name: Offline cross-format reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin the setup action: the moving v1 tag currently requests a Nu
      # release that its own asset resolver cannot install on some runners.
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: latest
      - uses: astral-sh/setup-uv@v6
      - run: moon update
      - name: Compare saved real projections and independent Atom Entry
        run: uv run --with feedparser==6.0.11 python tools/check_real_cross_format.py

  library:
    name: ${{ matrix.target }} library checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, js, native]
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.23
        with:
          # The local 0.1.20260920 toolchain has no downloadable Linux asset
          # (the official versioned URL returns 403); latest is verified
          # downloadable for GitHub-hosted Linux runners.
          version: latest
      - name: Refresh MoonBit registry
        run: moon update
      - name: Check
        run: moon check --target ${{ matrix.target }}
      - name: Test
        run: moon test --target ${{ matrix.target }}

  native-cli:
    name: native CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1.23
        with:
          version: latest
      - name: Refresh MoonBit registry
        run: moon update
      - name: Render RSS and Atom summaries
        run: |
          moon run --target native cmd/main samples/rss2_compat.xml
          moon run --target native cmd/main samples/atom1_compat.xml
      - name: Emit JSON Feed normalized JSON
        run: |
          moon run --target native cmd/main --json samples/jsonfeed11_compat.json > feedlens.json
          python3 -c "import json; result=json.load(open('feedlens.json', encoding='utf-8')); assert result['format'] == 'jsonfeed1'; assert len(result['entries']) == 2"
      - name: Inspect attachment samples
        run: |
          moon run --target native cmd/main samples/rss2_attachments.xml > rss-attachments.txt
          grep -q 'attachments: 2' rss-attachments.txt
          moon run --target native cmd/main --json samples/atom1_attachments.xml > atom-attachments.json
          moon run --target native cmd/main --json samples/jsonfeed11_attachments.json > json-attachments.json
          python3 -c "import json; atom=json.load(open('atom-attachments.json', encoding='utf-8')); jf=json.load(open('json-attachments.json', encoding='utf-8')); assert atom['entries'][0]['link'] == 'https://example.test/articles/one'; assert len(atom['entries'][0]['attachments']) == 2; assert jf['entries'][0]['attachments'][0]['duration_in_seconds'] == 12.5"
      - name: Inspect real-feed offline projections
        run: |
          moon run --target native cmd/main samples/real_wptavern_rss.xml > real-rss.txt
          grep -q 'rss_image:' real-rss.txt
          grep -q 'size (bytes): 37878054' real-rss.txt
          moon run --target native cmd/main --json samples/real_wptavern_atom.xml > real-atom.json
          moon run --target native cmd/main --json samples/real_wptavern_json.json > real-json.json
          python3 -c "import json; atom=json.load(open('real-atom.json', encoding='utf-8')); jf=json.load(open('real-json.json', encoding='utf-8')); assert len(atom['entries']) == len(jf['entries']) == 2; assert atom['images'][0]['role'] == 'atom_icon'; assert jf['images'][0]['role'] == 'json_icon'; assert jf['entries'][0]['images'][0]['role'] == 'json_featured'; assert atom['entries'][0]['attachments'][0]['size_in_bytes'] == jf['entries'][0]['attachments'][0]['size_in_bytes'] == 37878054"
      - name: Inspect distinct JSON item display fields
        run: |
          moon run --target native cmd/main --json samples/jsonfeed11_display.json > display.json
          python3 -c "import json; x=json.load(open('display.json', encoding='utf-8')); e=x['entries'][0]; assert x['language'] == 'en-US'; assert x['images'][1]['role'] == 'json_favicon'; assert e['link'] == 'posts/one'; assert e['external_url'] == 'https://outside.test/story'; assert [i['role'] for i in e['images']] == ['json_featured','json_banner']; assert e['attachments'] == []"
      - name: Inspect Atom XHTML normalized JSON
        run: |
          moon run --target native cmd/main --json samples/atom1_xhtml.xml > atom-xhtml.json
          python3 -c "import json; x=json.load(open('atom-xhtml.json', encoding='utf-8')); e=x['entries'][0]; assert x['title'] == 'Plan A & B' and x['title_kind'] == 'xhtml' and '<h:em' in x['title_xhtml']['markup']; assert e['title'] == 'Race review' and e['content_kind'] == 'xhtml' and '<h:strong' in e['content_xhtml']['markup']"
      - name: Inspect Atom external and text MIME content
        run: |
          moon run --target native cmd/main --json samples/atom1_content_sources.xml > atom-content-sources.json
          python3 -c "import json; x=json.load(open('atom-content-sources.json', encoding='utf-8')); a,b=x['entries']; assert a['content'] is None and a['content_source'] == 'issue.pdf' and a['content_media_type'] == 'application/pdf'; assert b['content'] == 'Heading & details' and b['content_media_type'] == 'text/markdown'; assert x['diagnostics'] == []"
      - name: Inspect Atom content variants
        run: |
          moon run --target native cmd/main --json samples/atom1_content_forms.xml > atom-content.json
          python3 -c "import json; x=json.load(open('atom-content.json', encoding='utf-8')); e=x['entries']; assert [v['atom_body']['kind'] for v in e] == ['external','inline_text','inline_xml','inline_binary']; assert e[0]['atom_body']['src'] == 'entry.xml'; assert e[1]['atom_body']['media_type'] == 'TEXT/MARKDOWN'; assert '<n0:root' in e[2]['atom_body']['markup']; assert e[3]['atom_body']['base64'] == 'AQID/w==' and e[3]['atom_body']['byte_length'] == 4"
      - name: Inspect additional standard fields
        run: |
          moon run --target native cmd/main --json samples/rss2_standard_fields.xml > standard-rss.json
          moon run --target native cmd/main --json samples/atom1_standard_fields.xml > standard-atom.json
          moon run --target native cmd/main --json samples/jsonfeed11_standard_fields.json > standard-json.json
          python3 -c "import json; r=json.load(open('standard-rss.json')); a=json.load(open('standard-atom.json')); j=json.load(open('standard-json.json')); assert r['generator']=='Publisher 2' and r['entries'][0]['comments_url']=='comments/one'; assert a['rights_kind']=='xhtml' and a['rights_xhtml']['markup']; assert j['next_url']=='older.json' and j['expired'] is False and j['entries'][0]['content_text']=='One' and j['authors'][0]['avatar']=='avatars/editor.png'"
      - name: Run independent library consumer example
        run: |
          moon run --target native examples/consumer > consumer.txt
          grep -q 'published=2026-10-19T08:30:00Z' consumer.txt
          grep -q 'featured=https://example.test/images/preview.png' consumer.txt
          grep -q 'xhtml_title=Plan A' consumer.txt
          grep -q 'atom_binary_bytes=3' consumer.txt
          grep -q 'atom_entry_link=https://example.test/news/posts/one' consumer.txt
      - name: Show CLI help
        run: moon run --target native cmd/main -- --help
